<!doctype html><meta charset="utf-8"><title>Body-map PNG reconstruction</title><style>body{font:16px system-ui;margin:32px;max-width:920px}button,input{font:inherit;margin:8px 0}#out{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}canvas{width:100%;border:1px solid #ccc}small{display:block;color:#555}</style>
<h1>Body-map PNG reconstruction</h1><p>Select one response JSON exported from the <b>Responses</b> sheet. Serve this repository with VS Code Live Server, then open this file so it uses the exact bundled <code>front.jpg</code> and <code>back.jpg</code> assets.</p><input id="file" type="file" accept="application/json"><button id="zip">Download all PNGs</button><small id="status"></small><div id="out"></div><script>
const W=360,H=480,front=new Image(),back=new Image();front.src='../docs/front.jpg';back.src='../docs/back.jpg';let rendered=[];
const bg=(c,side)=>{c.clearRect(0,0,W,H);c.fillStyle='#fff';c.fillRect(0,0,W,H);const im=side==='front'?front:back,scale=Math.min(W/im.naturalWidth,H/im.naturalHeight),w=im.naturalWidth*scale,h=im.naturalHeight*scale;c.drawImage(im,(W-w)/2,(H-h)/2,w,h)};
const paint=(c,s)=>{const p=s.points;if(!p?.length)return;c.save();c.globalAlpha=.72;c.strokeStyle=s.color;c.fillStyle=s.color;c.lineWidth=s.size;c.lineCap='round';c.lineJoin='round';c.beginPath();if(p.length===1){c.arc(p[0].x,p[0].y,s.size/2,0,Math.PI*2);c.fill()}else{c.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)c.lineTo(p[i].x,p[i].y);c.stroke()}c.restore()};
function png(trial,steps){const o=document.createElement('canvas');o.width=760;o.height=530;const c=o.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,o.width,o.height);c.fillStyle='#253243';c.font='600 16px sans-serif';['front','back'].forEach((side,i)=>{const l=document.createElement('canvas');l.width=W;l.height=H;const x=l.getContext('2d');bg(x,side);if(steps){for(const p of (trial.path||[]).filter(q=>q.side===side)){x.beginPath();x.fillStyle=p.step===1?'#bd5d45':'#243e5b';x.arc(p.x,p.y,13,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font='bold 12px sans-serif';x.fillText(String(p.step),p.x,p.y)}}else for(const s of trial.map?.[side]||[])paint(x,s);const left=i?390:10;c.fillText(side==='front'?'Front':'Back',left+150,24);c.drawImage(l,left,40)});return o}
file.onchange=async()=>{const data=JSON.parse(await file.files[0].text()),result=data.payload||data;await Promise.all([front.decode(),back.decode()]);out.innerHTML='';rendered=[];for(const t of result.trials||[]){for(const [type,steps] of [['body-map',false],['steps',true]]){if(steps&&!(t.path||[]).length)continue;const c=png(t,steps),name=`${result.participantId||'participant'}_trial-${t.trial}_${type}.png`;rendered.push({name,c});const box=document.createElement('div');box.innerHTML=`<b>${name}</b>`;box.append(c);out.append(box)}}status.textContent=`${rendered.length} PNGs reconstructed with ${result.renderingContract?.version||'legacy settings'}.`};
zip.onclick=async()=>{for(const x of rendered){const a=document.createElement('a');a.href=x.c.toDataURL('image/png');a.download=x.name;a.click();await new Promise(r=>setTimeout(r,150))}};
</script>
